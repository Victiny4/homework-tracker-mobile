name: Remove expired homework

on:
  schedule:
    - cron: '*/5 * * * *'   # runs every 5 minutes
  workflow_dispatch: {}    # also lets you click "Run workflow" manually on GitHub

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete assignments past their due date
        run: |
          curl -sS -X DELETE \
